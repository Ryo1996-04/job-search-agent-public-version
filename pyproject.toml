[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.3.0"
description = "Public version of a job-search agent: evidence bank, provenance validator and resume export. Never submits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
